# Phase 3: Fleet Reconnaissance
# Run: ansible all -m setup -a "filter=ansible_distribution*"
# Run: ansible all -m setup -a "filter=ansible_default_ipv4"
fleet_nodes:
  sdc-web:
    os: "Ubuntu 22.04"              # e.g. Ubuntu 22.04
    ip_address: "172.30.0.11"      # e.g. 172.30.0.99
  sdc-db:
    os: "Ubuntu 22.04"
    ip_address: "172.30.0.12"
  sdc-comms:
    os: "Ubuntu 22.04"
    ip_address: "172.30.0.13"

# Phase 4: Saboteur Chmod-777 Damage Report
# Run: ansible all -m shell -a "find /opt -perm -0777 -type f 2>/dev/null"
# List every file path found with 777 permissions (one per line)
compromised_files:
  - "/opt/fleet-data/deployment-manifest.txt"    # e.g. /opt/fleet-data/example-file.txt
  - "/opt/fleet-data/crew-rotation.txt"
  - "/opt/fleet-data/encryption-keys.txt"

# Phase 5: Filtered Facts
# Run: ansible all -m setup -a "filter=ansible_memtotal_mb"
fleet_memory_total_mb: 21372          # Sum of ansible_memtotal_mb across all 3 nodes
